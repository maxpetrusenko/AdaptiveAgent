[package]
name = "adaptive-retrieval"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
description = "Deterministic Rust hybrid retrieval core for AdaptiveAgent"

[lib]
name = "adaptive_retrieval"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["abi3-py311"] }
rayon = "1.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tantivy = "0.26.1"
thiserror = "2.0"

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.23"

[[bench]]
name = "search"
harness = false
