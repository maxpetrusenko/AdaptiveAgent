[project]
name = "adaptive-agent-backend"
version = "0.1.0"
description = "Self-improving AI agent backend"
requires-python = ">=3.11"
dependencies = [
    "adaptive-retrieval",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "langgraph>=0.4.0",
    "langchain>=1.0.0,<2",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=1.1.0",
    "python-dotenv>=1.0.0",
    "sse-starlette>=2.0.0",
    "httpx>=0.28.0",
    "tiktoken>=0.8.0",
    "langfuse>=4.0.0,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[project.scripts]
adaptive-agent-benchmark = "app.benchmarks.run:main"
adaptive-agent-compare = "app.benchmarks.compare:main"
adaptive-agent-adversarial = "app.benchmarks.adversarial:main"
adaptive-agent-judge-calibration = "app.benchmarks.judge_calibration:main"
adaptive-agent-benchmark-html = "app.benchmarks.report_html:main"
adaptive-agent-retrieval-benchmark = "app.benchmarks.retrieval_cli:main"

[tool.uv]
package = true

[tool.uv.sources]
adaptive-retrieval = { path = "../native/adaptive_retrieval" }

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
